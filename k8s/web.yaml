apiVersion: v1
kind: ConfigMap
metadata:
  name: web
data:
  default.conf: |
    server {
      listen 80;
      location / { root /usr/share/nginx/html; index index.html; }
      location /api/ { proxy_pass http://db:8001/; }
    }
  index.html: |
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>SQLite on k3s</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: .4rem .7rem; text-align: left; }
        th { background: #f3f3f3; }
      </style>
    </head>
    <body>
      <h1>Items from SQLite</h1>
      <p>Database time now (UTC): <b id="now">...</b></p>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Created (DB time, UTC)</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4">Loading...</td></tr></tbody>
      </table>
      <script>
        fetch('/api/app/items.json?_shape=array')
          .then(r => r.json())
          .then(items => {
            document.getElementById('rows').innerHTML = items.map(i =>
              `<tr><td>${i.id}</td><td>${i.name}</td><td>${i.description}</td><td>${i.created_at}</td></tr>`).join('');
          })
          .catch(e => { document.getElementById('rows').innerHTML = `<tr><td colspan="4">Error: ${e}</td></tr>`; });
        fetch('/api/app.json?sql=select+datetime(%27now%27)+as+t&_shape=array')
          .then(r => r.json())
          .then(d => { document.getElementById('now').textContent = d[0].t; });
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - {name: web, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            - {name: web, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
      volumes:
        - name: web
          configMap:
            name: web
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: {number: 80}
